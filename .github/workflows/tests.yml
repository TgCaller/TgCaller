name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - fix/tgcaller-repository-repair
      - repair/tgcaller-foundational

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest

      - name: Build distribution
        run: python -m build
